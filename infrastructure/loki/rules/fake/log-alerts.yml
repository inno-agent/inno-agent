# Log-based alerts: Loki ruler → Alertmanager → Telegram.
# Allowlist app services only — never alert on observability stack (loki, promtail, …).
groups:
  - name: application-logs
    interval: 1m
    rules:
      - alert: LogPanicOrFatal
        expr: |
          sum by (service, env) (
            count_over_time(
              {job="docker", service=~"chat-api|identity|orchestrator|review-api|review-webhook|review-consumer|issue-consumer|review-agent|review-front|frontend"}
              | json
              | level=~"panic|fatal"
              [5m]
            )
          ) > 0
        for: 1m
        labels:
          severity: critical
          alert_source: logs
        annotations:
          summary: "{{ $labels.service }} — {{ $value }} panic/fatal за 5 мин ({{ $labels.env }})"
          action: "docker compose logs {{ $labels.service }} --since 15m 2>&1 | grep -iE 'panic|fatal|\"level\":\"fatal\"|\"level\":\"panic\"'"
          loki_query: '{job="docker",service="{{ $labels.service }}"} | json | level=~"panic|fatal"'

      - alert: LogWarnBurst
        expr: |
          sum by (service, env) (
            count_over_time(
              {job="docker", service=~"chat-api|identity|orchestrator|review-api|review-webhook|review-consumer|issue-consumer|review-agent|review-front|frontend"}
              | json
              | level="warn"
              [5m]
            )
          ) > 10
        for: 5m
        labels:
          severity: warning
          alert_source: logs
        annotations:
          summary: "{{ $labels.service }} — {{ $value }} warn за 5 мин ({{ $labels.env }})"
          action: "docker compose logs {{ $labels.service }} --since 15m 2>&1 | grep -iE 'warn|\"level\":\"warn\"'"
          loki_query: '{job="docker",service="{{ $labels.service }}"} | json | level="warn"'
