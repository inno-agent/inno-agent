# Log-based alerts: Loki ruler → Alertmanager → Telegram.
# Mount: /etc/loki/rules/fake/*.yml (tenant "fake" = single-tenant default).
# Requires promtail job "docker". Uses | json | level= to avoid false positives
# from unstructured log lines (e.g. Loki mentioning "fatal" in file paths).
groups:
  - name: application-logs
    interval: 1m
    rules:
      - alert: LogPanicOrFatal
        expr: |
          sum by (service, env) (
            count_over_time(
              {job="docker", service!~"loki|promtail|prometheus|grafana|alertmanager"}
              | json
              | level=~"panic|fatal"
              [5m]
            )
          ) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Panic/fatal log on {{ $labels.service }}"
          description: "At least one panic or fatal log line in the last 5m (service={{ $labels.service }}, env={{ $labels.env }})."

      - alert: LogWarnBurst
        expr: |
          sum by (service, env) (
            count_over_time(
              {job="docker", service!~"loki|promtail|prometheus|grafana|alertmanager"}
              | json
              | level="warn"
              [5m]
            )
          ) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Warn log burst on {{ $labels.service }}"
          description: "More than 10 warn lines in 5m (service={{ $labels.service }}, env={{ $labels.env }})."
