server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 102400

scrape_configs:
  - job_name: nginx_json
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          service: proxy
          env: local
          __path__: /var/log/nginx/access_json.log
    pipeline_stages:
      - json:
          expressions:
            time: time
            correlation_id: correlation_id
            request_id: request_id
            host: host
            remote_addr: remote_addr
            method: method
            uri: uri
            status: status
            body_bytes_sent: body_bytes_sent
            request_time: request_time
            upstream_addr: upstream_addr
            upstream_status: upstream_status
            upstream_response_time: upstream_response_time
      - timestamp:
          source: time
          format: RFC3339
      - labels:
          correlation_id: correlation_id
          request_id: request_id
          host: host
          method: method
          status: status
          service: proxy

  # Docker container stdout/stderr → Loki (Go zap JSON + plain-text Node logs).
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        regex: 'inno-agent'
        action: keep
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: ''
        action: drop
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - target_label: job
        replacement: docker
      - target_label: env
        replacement: local
    pipeline_stages:
      - cri: {}
      - json:
          expressions:
            level: level
            msg: msg
          source: content
      - labels:
          level:
